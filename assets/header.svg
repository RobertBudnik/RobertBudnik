<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Robert Budnik</title>
  <desc id="desc">Terminal: whoami — Robert Budnik, student informatyki, Collegium Da Vinci, Poznań. Focus: sieci, linux, python, cybersecurity.</desc>
  <defs>
    <clipPath id="win"><rect x="0.5" y="0.5" width="899" height="319" rx="12"/></clipPath>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="0.82" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; }
    .fg { fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .dim { fill: #6e7681; }
    .name { font-size: 46px; font-weight: 700; letter-spacing: 4px; }
    .small { font-size: 11px; }
    .in { animation: in .45s ease-out both; }
    .type { animation-name: type; animation-fill-mode: both; }
    .net { animation: in 1.2s ease-out .2s both; }
    .cursor { animation: in .2s 3.2s both, blink 1.1s 3.4s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#win)">
    <rect width="900" height="320" fill="#0d1117"/>
    <rect width="900" height="320" fill="url(#grid)"/>
    <rect width="900" height="320" fill="url(#fade)"/>

    <!-- title bar -->
    <rect width="900" height="38" fill="#161b22"/>
    <line x1="0" y1="38.5" x2="900" y2="38.5" stroke="#21262d"/>
    <circle cx="24" cy="19" r="6" fill="#30363d"/>
    <circle cx="44" cy="19" r="6" fill="#30363d"/>
    <circle cx="64" cy="19" r="6" fill="#30363d"/>
    <text x="450" y="24" text-anchor="middle" class="dim" style="font-size:13px">robert@budnik: ~</text>

    <!-- network -->
    <g class="net">
      <g stroke="#30363d" stroke-width="1.2">
        <line x1="632" y1="112" x2="712" y2="78"/>
        <line x1="712" y1="78" x2="800" y2="118"/>
        <line x1="800" y1="118" x2="862" y2="82"/>
        <line x1="632" y1="112" x2="690" y2="182"/>
        <line x1="712" y1="78" x2="690" y2="182"/>
        <line x1="800" y1="118" x2="782" y2="198"/>
        <line x1="690" y1="182" x2="782" y2="198"/>
        <line x1="782" y1="198" x2="856" y2="236"/>
        <line x1="862" y1="82" x2="856" y2="236"/>
        <line x1="690" y1="182" x2="628" y2="252"/>
        <line x1="628" y1="252" x2="728" y2="270"/>
        <line x1="728" y1="270" x2="782" y2="198"/>
        <line x1="728" y1="270" x2="856" y2="236"/>
      </g>
      <g fill="#0d1117" stroke="#6e7681" stroke-width="1.5">
        <circle cx="632" cy="112" r="3.5"/>
        <circle cx="712" cy="78" r="3.5"/>
        <circle cx="800" cy="118" r="3.5"/>
        <circle cx="862" cy="82" r="3.5"/>
        <circle cx="690" cy="182" r="3.5"/>
        <circle cx="856" cy="236" r="3.5"/>
        <circle cx="628" cy="252" r="3.5"/>
        <circle cx="728" cy="270" r="3.5"/>
      </g>
      <circle cx="782" cy="198" r="9" fill="none" stroke="#8b949e" stroke-width="1" opacity="0">
        <animate attributeName="r" values="6;20" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="782" cy="198" r="5" fill="#e6edf3"/>
      <circle r="2.5" fill="#e6edf3" opacity="0">
        <animateMotion path="M632,112 L712,78 L800,118 L782,198" dur="3.6s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.6s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#e6edf3" opacity="0">
        <animateMotion path="M628,252 L728,270 L782,198 L856,236" dur="3.2s" begin="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.2s" begin="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="868" y="302" text-anchor="end" class="dim small">10.0.0.0/24</text>
    </g>

    <!-- $ whoami -->
    <text x="32" y="84" class="in" style="animation-delay:.1s"><tspan class="muted">robert@budnik</tspan><tspan class="dim">:~$</tspan></text>
    <text x="185" y="84" class="fg type" style="animation-duration:.45s;animation-delay:.35s;animation-timing-function:steps(6)">whoami</text>
    <text x="30" y="140" class="fg name in" style="animation-delay:.95s">ROBERT BUDNIK</text>
    <text x="32" y="172" class="muted in" style="animation-delay:1.2s">student informatyki · Collegium Da Vinci, Poznań</text>

    <!-- $ cat focus.txt -->
    <text x="32" y="222" class="in" style="animation-delay:1.6s"><tspan class="muted">robert@budnik</tspan><tspan class="dim">:~$</tspan></text>
    <text x="185" y="222" class="fg type" style="animation-duration:.8s;animation-delay:1.85s;animation-timing-function:steps(13)">cat focus.txt</text>
    <text x="32" y="252" class="in" style="animation-delay:2.8s"><tspan class="muted">sieci · linux · python  →  </tspan><tspan class="fg">cybersecurity</tspan></text>

    <!-- prompt + cursor -->
    <text x="32" y="294" class="in" style="animation-delay:3.2s"><tspan class="muted">robert@budnik</tspan><tspan class="dim">:~$</tspan></text>
    <rect x="186" y="281" width="9" height="17" fill="#8b949e" class="cursor"/>
  </g>

  <rect x="0.5" y="0.5" width="899" height="319" rx="12" fill="none" stroke="#30363d"/>
</svg>
